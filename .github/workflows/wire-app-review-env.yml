# One-shot ops: upsert the App Review sign-in env on the VPS and reload the app.
# Trigger: workflow_dispatch only. Does not change app code and runs no migration.
# Secrets (repo): APP_REVIEW_EMAILS (comma-separated demo emails), APP_REVIEW_CODE (6 digits).
# Values are never printed.
name: Wire App Review env on VPS

on:
  workflow_dispatch:

concurrency:
  group: wire-app-review-env-vps
  cancel-in-progress: false

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          if [ -z "${VPS_SSH_KEY:-}" ]; then
            echo "::error::VPS_SSH_KEY secret missing"
            exit 1
          fi
          key="${VPS_SSH_KEY//$'\r'/}"
          key="${key//\\n/$'\n'}"
          printf '%s\n' "$key" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null
          HOST="${{ secrets.VPS_HOST || vars.VPS_HOST }}"
          USER="${{ secrets.VPS_USER || vars.VPS_USER || 'deploy' }}"
          if [ -z "$HOST" ]; then
            echo "::error::VPS_HOST is not set"
            exit 1
          fi
          echo "HOST=$HOST" >> "$GITHUB_ENV"
          echo "USER=$USER" >> "$GITHUB_ENV"
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Upsert App Review env, reload
        env:
          APP_REVIEW_EMAILS: ${{ secrets.APP_REVIEW_EMAILS }}
          APP_REVIEW_CODE: ${{ secrets.APP_REVIEW_CODE }}
        run: |
          set -euo pipefail
          : "${APP_REVIEW_EMAILS:?APP_REVIEW_EMAILS secret missing}"
          : "${APP_REVIEW_CODE:?APP_REVIEW_CODE secret missing}"
          if ! [[ "$APP_REVIEW_CODE" =~ ^[0-9]{6}$ ]]; then
            echo "::error::APP_REVIEW_CODE must be exactly 6 digits"
            exit 1
          fi
          # Quote exports into remote bash stdin (never use `ssh env`).
          {
            printf 'export APP_REVIEW_EMAILS=%q\n' "$APP_REVIEW_EMAILS"
            printf 'export APP_REVIEW_CODE=%q\n' "$APP_REVIEW_CODE"
            cat <<'REMOTE'
          set -euo pipefail
          APP_DIR=/var/www/theartistpost
          ENV_FILE="$APP_DIR/.env"
          whoami_now="$(whoami)"
          if [[ "$whoami_now" == "root" ]]; then
            echo "ERROR: refuse to mutate .env as root"
            exit 1
          fi
          if [[ ! -f "$ENV_FILE" ]]; then
            echo "ERROR: missing $ENV_FILE"
            exit 1
          fi

          umask 077
          cp -a "$ENV_FILE" "${ENV_FILE}.bak.$(date -u +%Y%m%dT%H%M%SZ)"
          tmp="$(mktemp)"
          grep -Ev '^(#\s*)?(APP_REVIEW_EMAILS|APP_REVIEW_CODE)=' "$ENV_FILE" > "$tmp" || true
          {
            cat "$tmp"
            printf '\n# App Review sign-in (exact listed non-admin emails, fixed 6-digit code)\n'
            printf 'APP_REVIEW_EMAILS=%s\n' "$APP_REVIEW_EMAILS"
            printf 'APP_REVIEW_CODE=%s\n' "$APP_REVIEW_CODE"
          } > "$ENV_FILE"
          rm -f "$tmp"
          chmod 600 "$ENV_FILE"

          echo "Env keys present:"
          grep -E '^(APP_REVIEW_EMAILS|APP_REVIEW_CODE)=' "$ENV_FILE" \
            | sed -E 's/=.*/=✓/'

          cd "$APP_DIR"
          git rev-parse --short HEAD
          pm2 restart theartistpost --update-env
          pm2 save

          code="000"
          for _ in 1 2 3 4 5 6 7 8; do
            code="$(curl -sS -o /tmp/tap-auth-me.json -w '%{http_code}' --max-time 5 http://127.0.0.1:3013/api/v1/auth/me 2>/dev/null || echo 000)"
            if [[ "$code" == "401" || "$code" == "200" ]]; then
              break
            fi
            sleep 2
          done
          echo "local GET /api/v1/auth/me → $code"
          REMOTE
          } | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$USER@$HOST" 'bash -s'

      - name: Public smoke
        run: |
          set -euo pipefail
          me="$(curl -sS -o /tmp/me.json -w '%{http_code}' --max-time 15 'https://theartistpost.fluxlab.agency/api/v1/auth/me')"
          echo "public me=$me"
          test "$me" = "401"
