# One-shot ops: upsert Supabase Auth env on VPS + prisma migrate deploy.
# Trigger: workflow_dispatch (any ref that has this file). Does not change app code.
name: Wire Supabase Auth env on VPS

on:
  workflow_dispatch:
  # Allows cutover from a feature branch before this file lands on main
  # (GitHub only lists workflow_dispatch from the default branch).
  push:
    branches: [cursor/wire-supabase-vps-93b6]

concurrency:
  group: wire-supabase-env-vps
  cancel-in-progress: false

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          if [ -z "${VPS_SSH_KEY:-}" ]; then
            echo "::error::VPS_SSH_KEY secret missing"
            exit 1
          fi
          key="${VPS_SSH_KEY//$'\r'/}"
          key="${key//\\n/$'\n'}"
          printf '%s\n' "$key" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null
          HOST="${{ secrets.VPS_HOST || vars.VPS_HOST }}"
          USER="${{ secrets.VPS_USER || vars.VPS_USER || 'deploy' }}"
          if [ -z "$HOST" ]; then
            echo "::error::VPS_HOST is not set"
            exit 1
          fi
          echo "HOST=$HOST" >> "$GITHUB_ENV"
          echo "USER=$USER" >> "$GITHUB_ENV"
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Upsert Supabase env, migrate, reload
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_JWKS_URL: ${{ secrets.SUPABASE_JWKS_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          AGENT_SSH_PUBKEY: ${{ secrets.AGENT_SSH_PUBKEY }}
        run: |
          set -euo pipefail
          : "${SUPABASE_URL:?SUPABASE_URL secret missing}"
          : "${SUPABASE_JWKS_URL:?SUPABASE_JWKS_URL secret missing}"
          : "${SUPABASE_PUBLISHABLE_KEY:?SUPABASE_PUBLISHABLE_KEY secret missing}"
          # Quote exports into remote bash stdin (pubkey has spaces; never use `ssh env`).
          {
            printf 'export SUPABASE_URL=%q\n' "$SUPABASE_URL"
            printf 'export SUPABASE_JWKS_URL=%q\n' "$SUPABASE_JWKS_URL"
            printf 'export SUPABASE_PUBLISHABLE_KEY=%q\n' "$SUPABASE_PUBLISHABLE_KEY"
            printf 'export SUPABASE_SECRET_KEY=%q\n' "${SUPABASE_SECRET_KEY:-}"
            printf 'export AGENT_SSH_PUBKEY=%q\n' "${AGENT_SSH_PUBKEY:-}"
            cat <<'REMOTE'
          set -euo pipefail
          APP_DIR=/var/www/theartistpost
          ENV_FILE="$APP_DIR/.env"
          whoami_now="$(whoami)"
          if [[ "$whoami_now" == "root" ]]; then
            echo "ERROR: refuse to mutate .env as root"
            exit 1
          fi
          if [[ ! -f "$ENV_FILE" ]]; then
            echo "ERROR: missing $ENV_FILE"
            exit 1
          fi

          # Optional: authorize cloud-agent pubkey for later SSH (idempotent).
          if [[ -n "${AGENT_SSH_PUBKEY:-}" ]]; then
            mkdir -p "$HOME/.ssh"
            chmod 700 "$HOME/.ssh"
            touch "$HOME/.ssh/authorized_keys"
            chmod 600 "$HOME/.ssh/authorized_keys"
            if ! grep -Fqx "$AGENT_SSH_PUBKEY" "$HOME/.ssh/authorized_keys"; then
              printf '%s\n' "$AGENT_SSH_PUBKEY" >> "$HOME/.ssh/authorized_keys"
              echo "Appended AGENT_SSH_PUBKEY to authorized_keys"
            else
              echo "AGENT_SSH_PUBKEY already present"
            fi
          fi

          umask 077
          cp -a "$ENV_FILE" "${ENV_FILE}.bak.$(date -u +%Y%m%dT%H%M%SZ)"
          tmp="$(mktemp)"
          grep -Ev '^(#\s*)?(SUPABASE_URL|SUPABASE_JWKS_URL|SUPABASE_PUBLISHABLE_KEY|SUPABASE_SECRET_KEY|NEXT_PUBLIC_SUPABASE_URL|NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY|NEXT_PUBLIC_SUPABASE_ANON_KEY)=' "$ENV_FILE" > "$tmp" || true
          {
            cat "$tmp"
            printf '\n# Supabase Auth (JWKS + client publishable)\n'
            printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL"
            printf 'SUPABASE_JWKS_URL=%s\n' "$SUPABASE_JWKS_URL"
            printf 'SUPABASE_PUBLISHABLE_KEY=%s\n' "$SUPABASE_PUBLISHABLE_KEY"
            printf 'NEXT_PUBLIC_SUPABASE_URL=%s\n' "$SUPABASE_URL"
            printf 'NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=%s\n' "$SUPABASE_PUBLISHABLE_KEY"
            if [[ -n "${SUPABASE_SECRET_KEY:-}" ]]; then
              printf 'SUPABASE_SECRET_KEY=%s\n' "$SUPABASE_SECRET_KEY"
            fi
          } > "$ENV_FILE"
          rm -f "$tmp"
          chmod 600 "$ENV_FILE"

          echo "Env keys present:"
          grep -E '^(SUPABASE_URL|SUPABASE_JWKS_URL|SUPABASE_PUBLISHABLE_KEY|NEXT_PUBLIC_SUPABASE_URL|NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY|SUPABASE_SECRET_KEY)=' "$ENV_FILE" \
            | sed -E 's/=.*/=✓/'

          cd "$APP_DIR"
          git rev-parse --short HEAD
          pnpm db:migrate
          pm2 restart theartistpost --update-env
          pm2 save

          code="000"
          for _ in 1 2 3 4 5 6 7 8; do
            code="$(curl -sS -o /tmp/tap-auth-me.json -w '%{http_code}' --max-time 5 http://127.0.0.1:3013/api/v1/auth/me 2>/dev/null || echo 000)"
            if [[ "$code" == "401" || "$code" == "200" ]]; then
              break
            fi
            sleep 2
          done
          echo "local GET /api/v1/auth/me → $code"
          link_code="$(curl -sS -o /tmp/tap-auth-link.json -w '%{http_code}' --max-time 5 -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:3013/api/v1/auth/link 2>/dev/null || echo 000)"
          echo "local POST /api/v1/auth/link → $link_code"
          REMOTE
          } | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$USER@$HOST" 'bash -s'

      - name: Public smoke
        run: |
          set -euo pipefail
          me="$(curl -sS -o /tmp/me.json -w '%{http_code}' --max-time 15 'https://theartistpost.fluxlab.agency/api/v1/auth/me')"
          link="$(curl -sS -o /tmp/link.json -w '%{http_code}' --max-time 15 -X POST -H 'Content-Type: application/json' -d '{}' 'https://theartistpost.fluxlab.agency/api/v1/auth/link')"
          echo "public me=$me link=$link"
          test "$me" = "401"
          test "$link" = "401"
